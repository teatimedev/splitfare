[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splitfare"
version = "0.1.0"
description = "Flight-hacker's scanner for short trips: split tickets, trip-shape search across a month, and it knows what's on when you land."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fast-flights>=3.0",
    "rich>=13.0",
    # fast-flights 3.x imports this but doesn't declare it
    "typing-extensions>=4.0",
    # used directly (also transitive via fast-flights — pinned so an upstream
    # stack swap can't break us)
    "primp>=0.6",
    "selectolax>=0.3",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2.0"]  # 2.x dropped mcp.server.fastmcp; server code targets 1.x
dev = ["pytest>=8.0"]

[project.scripts]
splitfare = "splitfare:main"
splitfare-mcp = "mcp_server:main"

[project.urls]
Repository = "https://github.com/teatimedev/splitfare"

[tool.setuptools]
py-modules = ["splitfare", "providers", "sources", "mcp_server"]
